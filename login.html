<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Maha Platform</title>
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <main class="auth-page">
    <div class="card auth-card">
      <div class="brand">
        <span class="brand-logo">M</span>
        <span class="brand-name">Maha Platform</span>
      </div>
      <h1>Sign in</h1>
      <p class="muted" style="margin:4px 0 20px">Demo mode — any email and password will work.</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" autocomplete="username" placeholder="you@company.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <p id="login-error" class="small" style="color:var(--danger);min-height:18px"></p>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
    </div>
  </main>
  <script src="js/ui.js"></script>
  <script>
    document.body.appendChild(App.ui.themeToggle("auth-theme-toggle"));
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("email").value.trim();
      var pw = document.getElementById("password").value;
      var err = document.getElementById("login-error");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = "Please enter a valid email."; return; }
      if (!pw) { err.textContent = "Please enter your password."; return; }
      try { localStorage.setItem("maha.auth", JSON.stringify({ email: email, at: Date.now() })); } catch (e2) {}
      location.href = "index.html#/dashboard";
    });
  </script>
</body>
</html>
