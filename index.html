<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maha Platform</title>
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-logo">M</span>
        <span class="brand-name">Maha Platform</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">Workspace: <strong id="org-name"></strong></div>
    </aside>
    <div class="backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button class="btn btn-icon menu-toggle" id="menu-toggle" type="button" aria-label="Open menu"></button>
        <div class="topbar-title" id="page-title"></div>
        <div class="topbar-spacer"></div>
        <button class="btn btn-icon" id="notif-btn" type="button" aria-label="Notifications"></button>
        <div class="dropdown">
          <button class="user-btn" id="user-btn" type="button" aria-haspopup="menu" aria-expanded="false"></button>
          <div class="dropdown-menu" id="user-menu" hidden></div>
        </div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/users.js"></script>
  <script src="js/pages/billing.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
